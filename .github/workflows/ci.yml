name: QuickCart CI Pipeline

on:
  push:
    branches: [ master, main, 'feature/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK 8.0.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Dependencies
      run: dotnet restore QuickCart.sln

    - name: Build Solution (Release)
      run: dotnet build QuickCart.sln --configuration Release --no-restore

    - name: Run Tests (if test projects exist)
      run: |
        if [ $(find . -name "*Test*.csproj" | wc -l) -gt 0 ]; then
          dotnet test QuickCart.sln --configuration Release --no-build --verbosity normal
        else
          echo "No test projects currently detected. Will run in Phase 5."
        fi
